# JozmozDNS - single-container deployment.
#   mkdir -p data certs && docker compose up -d
services:
  jozmozdns:
    build: .
    image: jozmozdns:local
    container_name: jozmozdns
    restart: always
    network_mode: "host"
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs
    environment:
      - TZ=UTC
      - JOZMOZDNS_HEALTH_PORT=8080
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s
